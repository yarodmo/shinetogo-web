<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="cer-es-t cer-es-d" lang="es" xml:lang="es" font-family="Outfit, Inter, system-ui, sans-serif">
  <title id="cer-es-t">Recubrimiento cerámico sobre la pintura de un auto (corte esquemático)</title>
  <desc id="cer-es-d">Corte transversal esquemático de la pintura de un auto: panel de acero, pintura y barniz, con una capa de recubrimiento cerámico encima. El agua forma gotas y resbala arrastrando la suciedad. Solo cualitativo: el agua y la suciedad resbalan, una superficie más fácil de lavar. Sin duraciones ni valores de dureza.</desc>
  <rect x="0.5" y="0.5" width="399" height="449" rx="20" fill="var(--bg-card, #111827)" stroke="var(--border-dark, rgba(255,255,255,0.08))"/>
