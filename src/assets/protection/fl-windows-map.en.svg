<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 706" role="img" aria-labelledby="flmap-en-t flmap-en-d" lang="en" xml:lang="en" font-family="Outfit, Inter, system-ui, sans-serif">
  <title id="flmap-en-t">Florida window tint: minimum VLT by window, passenger cars (sedans)</title>
  <desc id="flmap-en-d">Top view of a sedan with each window labeled with its minimum VLT under Florida law for passenger cars: front side windows 28%, rear side windows and rear window 15%, windshield only a transparent strip at the top (above the AS-1 line). Multipurpose vehicles: rear windows from 6%, if the vehicle is classified as one. We confirm how yours is classified. Measured on the finished window (glass + tint). Rules per F.S. 316.2951–316.2957 and 316.29545. Verify current law.</desc>
  <rect x="0.5" y="0.5" width="399" height="705" rx="20" fill="var(--bg-card, #111827)" stroke="var(--border-dark, rgba(255,255,255,0.08))"/>
