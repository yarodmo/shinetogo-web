<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" role="img" aria-labelledby="heat-es-t heat-es-d" lang="es" xml:lang="es" font-family="Outfit, Inter, system-ui, sans-serif">
  <title id="heat-es-t">Cómo llega el calor a la cabina, con y sin película (esquema)</title>
  <desc id="heat-es-d">Dos esquemas lado a lado. Izquierda: sol, vidrio sin película y cabina, con flechas gruesas que lo atraviesan y la etiqueta más calor. Derecha: sol, vidrio con película y cabina, con una flecha fina que pasa, dos flechas que rebotan y la etiqueta menos calor. Solo cualitativo, sin cifras.</desc>
