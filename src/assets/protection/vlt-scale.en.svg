<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 522" role="img" aria-labelledby="vlt-en-t vlt-en-d" lang="en" xml:lang="en" font-family="Outfit, Inter, system-ui, sans-serif">
  <title id="vlt-en-t">Window tint scale, 20% to 70% VLT, with where each tone would be legal (reference)</title>
  <desc id="vlt-en-d">Reference scale of four tint tones from 20% to 70% VLT (visible light transmission), from darkest to lightest, with where each tone would be legal on a passenger car without a medical exemption: 35%, 50% and 70% on all side and rear windows; 20% only behind the driver. Reference scale only, not legal advice.</desc>
  <rect x="0.5" y="0.5" width="399" height="521" rx="20" fill="var(--bg-card, #111827)" stroke="var(--border-dark, rgba(255,255,255,0.08))"/>
<defs><linearGradient id="vlt-en-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#fef3c7"/></linearGradient></defs><text x="24" y="46" font-size="30" font-weight="800" fill="var(--brand-blue, #0ea5e9)">VLT</text><text x="92" y="45" font-size="16" font-weight="600" fill="var(--text-light, #e2e8f0)">Visible Light Transmission</text><text font-size="15" font-weight="400" fill="var(--text-muted, #94a3b8)"><tspan x="24" y="72">Where each tone would be legal on a </tspan><tspan x="24" dy="20">passenger car (no medical exemption)</tspan></text><rect x="24" y="112" width="96" height="60" rx="10" fill="url(#vlt-en-sky)"/><circle cx="98" cy="132" r="10" fill="#f59e0b"/><rect x="24" y="112" width="96" height="60" rx="10" fill="#000000" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/><text x="140" y="130" font-size="22" font-weight="800" fill="var(--text-light, #e2e8f0)">20% VLT</text><text x="140" y="154" font-size="15" font-weight="500" fill="var(--apex-amber, #D4AF37)">Legal only behind the driver</text><text x="140" y="174" font-size="15" font-weight="500" fill="var(--apex-amber, #D4AF37)">(passenger car)</text><rect x="24" y="188" width="96" height="60" rx="10" fill="url(#vlt-en-sky)"/><circle cx="98" cy="208" r="10" fill="#f59e0b"/><rect x="24" y="188" width="96" height="60" rx="10" fill="#000000" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/><text x="140" y="206" font-size="22" font-weight="800" fill="var(--text-light, #e2e8f0)">35% VLT</text><text x="140" y="230" font-size="15" font-weight="500" fill="var(--text-light, #e2e8f0)">Legal on all side</text><text x="140" y="250" font-size="15" font-weight="500" fill="var(--text-light, #e2e8f0)">and rear windows</text><rect x="24" y="264" width="96" height="60" rx="10" fill="url(#vlt-en-sky)"/><circle cx="98" cy="284" r="10" fill="#f59e0b"/><rect x="24" y="264" width="96" height="60" rx="10" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/><text x="140" y="282" font-size="22" font-weight="800" fill="var(--text-light, #e2e8f0)">50% VLT</text><text x="140" y="306" font-size="15" font-weight="500" fill="var(--text-light, #e2e8f0)">Legal on all side</text><text x="140" y="326" font-size="15" font-weight="500" fill="var(--text-light, #e2e8f0)">and rear windows</text><rect x="24" y="340" width="96" height="60" rx="10" fill="url(#vlt-en-sky)"/><circle cx="98" cy="360" r="10" fill="#f59e0b"/><rect x="24" y="340" width="96" height="60" rx="10" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/><text x="140" y="358" font-size="22" font-weight="800" fill="var(--text-light, #e2e8f0)">70% VLT</text><text x="140" y="382" font-size="15" font-weight="500" fill="var(--text-light, #e2e8f0)">Legal on all side</text><text x="140" y="402" font-size="15" font-weight="500" fill="var(--text-light, #e2e8f0)">and rear windows</text><rect x="24" y="420" width="352" height="78" rx="12" fill="var(--bg-dark, #0a0e1a)" stroke="var(--border-dark, rgba(255,255,255,0.08))" stroke-width="1.5"/><text font-size="15" font-weight="500" fill="var(--text-light, #e2e8f0)"><tspan x="40" y="446">VLT = % of visible light that passes </tspan><tspan x="40" dy="20">through the glass and film. Lower = darker. </tspan><tspan x="40" dy="20">Reference scale only, not legal advice.</tspan></text>
</svg>
