<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" role="img" aria-labelledby="film-es-t film-es-d" lang="es" xml:lang="es" font-family="Outfit, Inter, system-ui, sans-serif">
  <title id="film-es-t">Corte transversal de una película de ventana (esquema)</title>
  <desc id="film-es-d">Corte transversal esquemático de una película de ventana aplicada por dentro del vidrio de un carro. De afuera hacia adentro: vidrio, adhesivo, capa de control solar (carbono o cerámica), poliéster y una capa dura (hard coat). El sol está afuera y la cabina adentro. Sin escala ni cifras.</desc>
