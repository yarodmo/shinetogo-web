name: 🚀 ShineToGo Mobile Detailing — Production Deploy

# Secrets del repo (Settings → Secrets and variables → Actions → Secrets):
#   VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY, SMTP_PASS, RECIPIENT
# Variables del repo (misma pantalla, pestaña Variables):
#   API_PORT, SMTP_HOST, SMTP_PORT, SMTP_USER, ALLOWED_ORIGINS,
#   VITE_SITE_URL, VITE_API_URL
# Ver .env.example para el significado de las VITE_*.

on:
  push:
    branches: [main]
  workflow_dispatch:  # Trigger manual desde GitHub UI

concurrency:
  group: production-deploy
  cancel-in-progress: false  # Nunca cancelar un deploy en progreso

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. CHECKOUT ──────────────────────────────────────────────
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      # ── 2. BUILD FRONTEND ────────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias frontend
        run: npm ci

      - name: 🏗️ Build React (Vite)
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      # ── 3. CONFIGURAR SSH ────────────────────────────────────────
      - name: 🔐 Configurar SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: ✅ Añadir VPS a known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ── 4. DEPLOY FRONTEND → public_html via rsync ───────────────
      # rsync opera SOLO sobre el directorio dist/ del usuario shinetogo.
      # Sin acceso root. Sin tocar otros usuarios ni vhosts del servidor.
      # rsync SOLO archivos compilados (dist/) al web root
      # El código fuente y la API viven en ~/app — nunca en public_html
      - name: 📤 Deploy frontend (rsync dist/ → public_html)
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            ./dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/public_html/

      - name: 📤 Deploy API (rsync api/ → ~/app/api)
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            ./api/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/app/api/

      # ── 5. DEPLOY API + LIMPIEZA PM2 + .ENV PERSISTENTE ────────────
      # .env físico — única fuente de verdad para lo que depende del
      # dominio/cuenta (puerto, SMTP, CORS). Nada de esto va hardcodeado
      # en ecosystem.config.cjs (ver comentario ahí).
      - name: 🚀 Configurar Entorno, Limpiar PM2 y Desplegar API
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -euo pipefail

            APP_DIR="/home/${{ secrets.VPS_USER }}/app/api"
            LOG_DIR="/home/${{ secrets.VPS_USER }}/logs"
            mkdir -p "$LOG_DIR"

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Deploy iniciado por GitHub Actions" >> "$LOG_DIR/deploy.log"

            # 1. Instalar dependencias
            cd "$APP_DIR"
            npm install --omit=dev --silent
            node --check server.js

            # 2. Escribir .env persistente
            echo "NODE_ENV=production" > .env
            echo "PORT=${{ vars.API_PORT }}" >> .env
            echo "SMTP_HOST=${{ vars.SMTP_HOST }}" >> .env
            echo "SMTP_PORT=${{ vars.SMTP_PORT }}" >> .env
            echo "SMTP_USER=${{ vars.SMTP_USER }}" >> .env
            echo "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" >> .env
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env
            echo "RECIPIENT=${{ secrets.RECIPIENT }}" >> .env

            # 3. Limpiar estado corrupto de PM2 y residuales
            pm2 delete shinetogo-api || true
            rm -f ~/.pm2/dump.pm2
            rm -f ~/app/ecosystem.config.cjs ~/app/package.json ~/app/package-lock.json || true

            # 4. Arrancar en limpio
            pm2 start "$APP_DIR/ecosystem.config.cjs" --env production
            pm2 save --force

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] PM2 desplegado OK desde .env persistente" >> "$LOG_DIR/deploy.log"
          ENDSSH

      # ── 6. HEALTH CHECK ──────────────────────────────────────────
      - name: 🏥 Health Check API
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            PASS=false
            for i in 1 2 3 4 5; do
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:${{ vars.API_PORT }}/api/health" 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "✅ Health Check PASS — HTTP $HTTP (intento $i)"
                PASS=true
                break
              fi
              echo "⏳ Intento $i/5 — HTTP $HTTP. Esperando 4s..."
              sleep 4
            done
            if [ "$PASS" = false ]; then
              echo "❌ Health Check FALLIDO"
              exit 1
            fi
          ENDSSH

      # ── 7. RESULTADO ─────────────────────────────────────────────
      - name: 📣 Resultado del deploy
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ ShineToGo Mobile Detailing deployed to production — $(date)"
          else
            echo "❌ Deploy FAILED — revisar logs en /home/${{ secrets.VPS_USER }}/logs/"
          fi
