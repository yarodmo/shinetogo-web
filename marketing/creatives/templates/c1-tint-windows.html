<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>C1 · Tint windows · {{lang}} · {{fmt}}</title>
<!-- Template: render.mjs fills the double-brace placeholders from copy.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ROOT}}/templates/base.css">
<style>html, body, .stage { width: {{W}}px; height: {{H}}px; }</style>
<style>
  .c1 .stage { background: var(--bg-dark); }
  .c1 .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(62% 34% at 50% 30%, rgba(245, 158, 11, 0.16), transparent 70%),
      radial-gradient(70% 36% at 0% 100%, rgba(14, 165, 233, 0.15), transparent 70%);
  }
  .c1 h1 { position: absolute; color: var(--text-white); }
  .c1 h1 .l2 { color: var(--brand-gold); }
  .c1 h1 span { display: block; }
  .c1 h1 .l1 { text-wrap: balance; }
  .c1 .area { position: absolute; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); white-space: nowrap; }
  .c1 .films { position: absolute; font-weight: 500; color: var(--text-light); white-space: nowrap; }
  .c1 .url { position: absolute; color: var(--text-light); white-space: nowrap; }
  .c1 .fine { position: absolute; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  .c1 .scheme { position: absolute; display: block; overflow: visible; }
  .c1 .card { display: none; }

  /* ---------- FEED 1080x1350 ---------- */
  .fmt-feed .badge { --bw: 200px; left: 72px; top: 60px; }
  .fmt-feed .area { right: 72px; top: 136px; font-size: 22px; }
  .fmt-feed h1 { left: 72px; top: 266px; width: 936px; font-size: 80px; }
  .fmt-feed.lang-es h1 { font-size: 68px; }
  .fmt-feed .scheme { left: 72px; top: 540px; width: 936px; height: 466px; }
  .fmt-feed .films { left: 72px; top: 1030px; font-size: 28px; }
  .fmt-feed .cta { left: 72px; top: 1088px; height: 96px; padding: 0 46px; border-radius: 48px; font-size: 38px; }
  .fmt-feed .url { left: 72px; top: 1218px; font-size: 28px; }
  .fmt-feed .fine { left: 72px; top: 1262px; font-size: 24px; }

  /* ---------- STORY 1080x1920 (safe zone: y 250 .. 1670) ---------- */
  .fmt-story .badge { --bw: 230px; left: 72px; top: 284px; }
  .fmt-story .area { right: 72px; top: 362px; font-size: 22px; }
  .fmt-story h1 { left: 72px; top: 540px; width: 936px; font-size: 100px; }
  .fmt-story.lang-es h1 { font-size: 84px; }
  .fmt-story .scheme { left: 72px; top: 850px; width: 936px; height: 466px; }
  .fmt-story .films { left: 72px; top: 1352px; font-size: 28px; }
  .fmt-story .cta { left: 72px; top: 1410px; height: 104px; padding: 0 50px; border-radius: 52px; font-size: 40px; }
  .fmt-story .url { left: 72px; top: 1554px; font-size: 28px; }
  .fmt-story .fine { left: 72px; top: 1598px; font-size: 24px; }

  /* ---------- LINK 1200x628 ---------- */
  .fmt-link .badge { --bw: 150px; left: 56px; top: 44px; }
  .fmt-link .area { left: 640px; width: 524px; top: 548px; font-size: 21px; text-align: center; text-transform: none; letter-spacing: 0.03em; }
  .fmt-link h1 { left: 56px; top: 186px; width: 560px; font-size: 52px; }
  .fmt-link.lang-es h1 { font-size: 44px; }
  .fmt-link .films { left: 56px; top: 366px; width: 560px; white-space: normal; line-height: 1.25; font-size: 22px; }
  .fmt-link .cta { left: 56px; top: 432px; height: 64px; padding: 0 32px; border-radius: 32px; font-size: 26px; }
  .fmt-link .url { left: 56px; top: 520px; font-size: 22px; }
  .fmt-link .fine { left: 56px; top: 558px; font-size: 21px; }
  .fmt-link .card { display: block; position: absolute; left: 640px; top: 36px; width: 524px; height: 556px; border-radius: 30px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); }
  .fmt-link .scheme { left: 658px; top: 166px; width: 488px; height: 243px; }
</style>
</head>
<body class="c1 fmt-{{fmt}} lang-{{lang}}">
<div class="stage">
  <div class="glow"></div>
  <div class="card"></div>

  <div class="badge"><img src="{{ROOT}}/assets/logo.jpg" alt=""></div>
  <div class="area">{{area}}</div>

  <h1><span class="l1">{{h1a}}</span><span class="l2">{{h1b}}</span></h1>

  <!-- Sun, glass with film, cabin. Same visual language as web SVG heat-path (qualitative, no numbers). -->
  <svg class="scheme" viewBox="0 0 936 466" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#f59e0b" stop-opacity="0.34"/>
        <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="cabinGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.30"/>
        <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="cabin" cx="50%" cy="0%" r="90%">
        <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="468" cy="88" r="200" fill="url(#halo)"/>
    <circle cx="468" cy="88" r="40" fill="#f59e0b"/>
    <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
      <line x1="522.0" y1="88.0" x2="540.0" y2="88.0"/>
      <line x1="514.8" y1="115.0" x2="530.4" y2="124.0"/>
      <line x1="495.0" y1="134.8" x2="504.0" y2="150.4"/>
      <line x1="468.0" y1="142.0" x2="468.0" y2="160.0"/>
      <line x1="441.0" y1="134.8" x2="432.0" y2="150.4"/>
      <line x1="421.2" y1="115.0" x2="405.6" y2="124.0"/>
      <line x1="414.0" y1="88.0" x2="396.0" y2="88.0"/>
      <line x1="421.2" y1="61.0" x2="405.6" y2="52.0"/>
      <line x1="441.0" y1="41.2" x2="432.0" y2="25.6"/>
      <line x1="468.0" y1="34.0" x2="468.0" y2="16.0"/>
      <line x1="495.0" y1="41.2" x2="504.0" y2="25.6"/>
      <line x1="514.8" y1="61.0" x2="530.4" y2="52.0"/>
    </g>
    <!-- incident rays -->
    <g stroke="#f59e0b" stroke-width="11" stroke-linecap="round" fill="#f59e0b">
      <line x1="208" y1="184" x2="208" y2="258"/><polygon points="208,284 184,256 232,256" stroke="none"/>
      <line x1="468" y1="184" x2="468" y2="258"/><polygon points="468,284 444,256 492,256" stroke="none"/>
      <line x1="728" y1="184" x2="728" y2="258"/><polygon points="728,284 704,256 752,256" stroke="none"/>
    </g>
    <!-- glass + film -->
    <rect x="56" y="288" width="824" height="22" rx="11" fill="#0ea5e9" fill-opacity="0.35" stroke="#0ea5e9" stroke-width="3"/>
    <rect x="66" y="310" width="804" height="8" fill="#d4af37"/>
    <!-- blocked / reflected -->
    <g fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 11">
      <path d="M190 278 Q164 228 120 194"/>
      <path d="M746 278 Q772 228 816 194"/>
    </g>
    <polygon points="95.7,176.4 131.8,177.8 108.2,210.2" fill="#0ea5e9"/>
    <polygon points="840.3,176.4 804.2,177.8 827.8,210.2" fill="#0ea5e9"/>
    <!-- what gets through: one thin ray -->
    <line x1="468" y1="332" x2="468" y2="394" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <polygon points="468,420 452,392 484,392" fill="#f59e0b"/>
    <!-- cabin -->
    <ellipse cx="468" cy="428" rx="150" ry="40" fill="url(#cabinGlow)"/>
    <rect x="238" y="426" width="460" height="38" rx="19" fill="#111827" stroke="#8e95a5" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="238" y="426" width="460" height="38" rx="19" fill="url(#cabin)"/>
  </svg>

  <div class="films">{{films}}</div>
  <div class="cta">{{cta}}</div>
  <div class="url mono-url">{{domain}} · {{phone}}</div>
  <div class="fine">{{free}}</div>
</div>
</body>
</html>
